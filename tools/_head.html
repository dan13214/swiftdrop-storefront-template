<style>
:root{--concrete:#e7e9e4;--paper:#f6f7f4;--tarmac:#1a2026;--steel:#5b666e;--line:#cfd4ce;--motorway:#1d5fa6;--route:#00703c;--amber:#f5b700;--route-yellow:#ffd200;--heavy:#a23a0c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--concrete);color:var(--tarmac);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:2px solid var(--tarmac)}
.mark{font-family:var(--display);font-weight:700;font-size:24px;text-decoration:none;margin-right:auto}
.top a.nav{font-weight:600;text-decoration:none}
.top a.nav:hover{text-decoration:underline}
.plate{display:inline-block;font-family:var(--display);font-weight:700;font-size:17px;line-height:1;padding:5px 9px 4px;border-radius:4px;background:var(--route);color:var(--route-yellow)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:14px 0 10px;text-wrap:balance}
.lede{color:var(--steel);margin:0 0 22px;max-width:64ch}
.notes{color:var(--steel);font-size:14.5px;max-width:72ch;margin-top:26px}
.notes p{margin:0 0 8px}
.cross{margin:44px 0 0;padding:20px 22px;background:var(--motorway);color:#fff;border-radius:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.cross strong{font-family:var(--display);font-size:26px;line-height:1.1}
.cross a{font-weight:600;background:var(--amber);color:var(--tarmac);text-decoration:none;padding:9px 14px;border-radius:6px}
footer{margin-top:44px;padding:22px 0 40px;border-top:2px solid var(--tarmac);color:var(--steel);font-size:14.5px}
footer p{margin:0 0 6px;max-width:78ch}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
