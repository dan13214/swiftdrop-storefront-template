<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{LEGAL_TITLE}} | {{BRAND_NAME}}</title>
<meta name="description" content="{{LEGAL_TITLE}} for {{BRAND_NAME}}.">
<link rel="canonical" href="{{SITE_URL}}/{{LEGAL_SLUG}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--SIM--><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"><!--/SIM-->
<!--TOOLKIT--><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap"><!--/TOOLKIT-->
<style>
/* Legal and contact pages. Same colours and type as the site they belong to, nothing else. */
<!--SIM-->:root{--bg:#e7e9e4;--ink:#1a2026;--muted:#5b666e;--line:#cfd4ce;--link:#1d5fa6;--box:#f6f7f4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--h-weight:700;--h-track:.01em}<!--/SIM-->
<!--TOOLKIT-->:root{--bg:#ffffff;--ink:#1f2933;--muted:#52606d;--line:#bcccdc;--link:#0b3bd9;--box:#f3f5f7;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--h-weight:800;--h-track:-.02em}<!--/TOOLKIT-->
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:2px solid var(--ink)}
.mark{font-family:var(--display);font-weight:var(--h-weight);font-size:24px;letter-spacing:var(--h-track);text-decoration:none;color:var(--ink);margin-right:auto}
.top a.nav{font-weight:600;text-decoration:none;color:var(--ink)}
.top a.nav:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:var(--h-weight);letter-spacing:var(--h-track);font-size:clamp(34px,6vw,52px);line-height:1.05;margin:36px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:var(--h-weight);letter-spacing:var(--h-track);font-size:26px;line-height:1.15;margin:38px 0 8px}
h3{font-size:17px;font-weight:600;margin:22px 0 4px}
p,ul,ol,dl{margin:0 0 14px}
ul,ol{padding-left:22px}
li{margin-bottom:6px}
.updated{color:var(--muted);font-size:15px;margin-bottom:22px}
.summary{background:var(--box);border:1px solid var(--line);border-left:5px solid var(--link);padding:16px 18px;margin:0 0 8px}
.summary p:last-child,.summary ul:last-child{margin-bottom:0}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
dl.facts dt{font-weight:600}
dl.facts dd{margin:0}
.form{background:var(--box);border:1px solid var(--line);padding:16px 18px;white-space:pre-line}
mark{background:#ffe14d;color:#1a2026;padding:0 3px}
.print{font:inherit;font-weight:600;color:var(--ink);background:none;border:1px solid var(--ink);border-radius:4px;padding:8px 14px;cursor:pointer;margin:6px 0 0}
footer{margin-top:54px;padding:22px 0 40px;border-top:2px solid var(--ink);color:var(--muted);font-size:15px}
footer a{color:inherit}
footer p{margin:0 0 8px}
@media (max-width:520px){dl.facts{grid-template-columns:1fr;gap:0}dl.facts dd{margin-bottom:10px}}
@media print{.top a.nav,.print,footer nav{display:none}body{background:#fff;font-size:12pt}a{color:inherit}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="/">{{BRAND_NAME}}</a>
    <a class="nav" href="/">Back to the site</a>
  </header>
  <main>
    <h1>{{LEGAL_TITLE}}</h1>
    <p class="updated">Last updated {{LEGAL_UPDATED}}</p>
{{LEGAL_BODY}}
    <p><button class="print" type="button" onclick="window.print()">Print or save this page</button></p>
  </main>
  <footer>
    <nav aria-label="Shop information"><p>{{LEGAL_LINKS}}</p></nav>
    <p>{{SELLER_LINE}}</p>
  </footer>
</div>
</body>
</html>
